<?xml version="1.0" encoding="UTF-8"?>
<!-- Twitcher app icon (master, full-bleed square: iOS rounds the corners). Rendered by tools/gen_assets.py with
     rsvg-convert. A glass speech bubble in the spirit of Twitch's "Glitch" (the cut corner, the two eyes, the tail,
     a darker body behind it) on a purple aqua tile. The icon carries its own gloss (UIPrerenderedIcon is on). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 160 160">
  <defs>
    <!-- the tile: light at the top, the aqua "horizon" in the middle, lighter again at the bottom -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3d6ff"/>
      <stop offset="0.46" stop-color="#a773ff"/>
      <stop offset="0.5" stop-color="#7a36e8"/>
      <stop offset="1" stop-color="#b48bff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <!-- the glass of the bubble: white at the top, lavender at the bottom -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f3eeff"/>
      <stop offset="1" stop-color="#d6c6ff"/>
    </linearGradient>
    <linearGradient id="faceGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <!-- the body behind the glass: deep purple, lit from above -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2bb8"/>
      <stop offset="1" stop-color="#2e0f6e"/>
    </linearGradient>
    <!-- the eyes: inset, dark at the top -->
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0c66"/>
      <stop offset="1" stop-color="#5b2fc0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="160" height="160" fill="url(#bg)"/>

  <!-- the bubble, drawn three times: a soft shadow, the dark body set off to the left and down, the glass face -->
  <g id="bubble" transform="translate(80,76) scale(1.1) translate(-80,-74)">
    <path transform="translate(0,6)" filter="url(#soft)" fill="#1d0650" fill-opacity="0.45"
          d="M54,36 L116,36 Q124,36 124,44 L124,84 Q124,92 116,92 L78,92 L60,110 L60,92 L44,92 Q36,92 36,84 L36,54 Z"/>
    <path transform="translate(-6,6)" fill="url(#body)"
          d="M54,36 L116,36 Q124,36 124,44 L124,84 Q124,92 116,92 L78,92 L60,110 L60,92 L44,92 Q36,92 36,84 L36,54 Z"/>
    <path fill="url(#face)" stroke="#4a1f9e" stroke-opacity="0.35" stroke-width="1"
          d="M54,36 L116,36 Q124,36 124,44 L124,84 Q124,92 116,92 L78,92 L60,110 L60,92 L44,92 Q36,92 36,84 L36,54 Z"/>
    <!-- the eyes -->
    <rect x="64" y="48" width="10" height="22" rx="3" fill="url(#eye)"/>
    <rect x="86" y="48" width="10" height="22" rx="3" fill="url(#eye)"/>
    <rect x="65.5" y="64" width="7" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="87.5" y="64" width="7" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>
    <!-- the glass highlight on the bubble -->
    <path fill="url(#faceGloss)"
          d="M54.5,36.5 L116,36.5 Q123.5,36.5 123.5,44 L123.5,60 Q80,66 36.5,60 L36.5,54.5 Z"/>
  </g>

  <!-- gloss over the whole tile -->
  <path d="M0,0 L160,0 L160,72 Q80,78 0,72 Z" fill="url(#gloss)"/>
</svg>
